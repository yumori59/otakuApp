name: Meigicho
options:
  bundleIdPrefix: jp.meigicho
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  Domain:
    path: Packages/Domain
  DataStore:
    path: Packages/DataStore
  Network:
    path: Packages/Network
  Features:
    path: Packages/Features
  # RevenueCat: 一時無効化中（自作 Network パッケージと Apple の Network.framework が
  # 衝突しクリーンビルドが失敗するため）。再有効化する場合は下のブロックのコメントを外す。
  # RevenueCat:
  #   url: https://github.com/RevenueCat/purchases-ios
  #   from: 5.14.0
  # GoogleMobileAds: 衝突調査 Spike（docs/plans 未作成、AdsSpike.swift のみで実測）
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Google OAuth（iOS 種別のクライアント ID）。空なら Google ログインは無効（ボタンは出るが理由を表示する）。
    # 例) GOOGLE_IOS_CLIENT_ID: 1234567890-abcdef.apps.googleusercontent.com
    #     GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.1234567890-abcdef
    # **この値が BE の GOOGLE_CLIENT_IDS に含まれていること**が動作条件（plan.md §7.2.1）
    GOOGLE_IOS_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: ""
    REVENUECAT_API_KEY: ""
  configs:
    Debug:
      API_BASE_URL: http://localhost:8080
    Release:
      # TODO: Cloud Run の URL を設定する（.xcconfig による環境分離は docs/09 1-16）
      API_BASE_URL: https://api.meigicho.example

targets:
  Meigicho:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meigicho.app
        INFOPLIST_KEY_CFBundleDisplayName: 参戦名義帳
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Features
        product: Features
      - package: Domain
        product: Domain
      - package: DataStore
        product: DataStore
      - package: Network
        product: Network
      # RevenueCat: 上の packages ブロックと合わせて一時無効化中
      # - package: RevenueCat
      #   product: RevenueCat
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 参戦名義帳
        UILaunchScreen: {}
        API_BASE_URL: $(API_BASE_URL)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        # ASWebAuthenticationSession のコールバック（reversed client ID スキーム）
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.googleusercontent.apps
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          # 共有リンクの受け口 `meigicho://share/<token>`（T4b / plan.md §7.7）。
          # Universal Links は roadmap 1-7 と同時の別計画
          - CFBundleTypeRole: Viewer
            CFBundleURLName: jp.meigicho.app.share
            CFBundleURLSchemes:
              - meigicho
        NSAppTransportSecurity:
          # ローカル API（http://localhost:8080）に到達するために必要。
          # 任意の平文通信を許す NSAllowsArbitraryLoads は使わない
          NSAllowsLocalNetworking: true
        NSUserNotificationsUsageDescription: FC更新期限と当落発表日をお知らせするために通知を使います。

schemes:
  Meigicho:
    build:
      targets:
        Meigicho: all
    run:
      config: Debug
