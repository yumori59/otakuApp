name: Meigicho
options:
  bundleIdPrefix: jp.meigicho
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  Domain:
    path: Packages/Domain
  DataStore:
    path: Packages/DataStore
  Network:
    path: Packages/Network
  Features:
    path: Packages/Features
  # RevenueCat: 一時無効化中（自作 Network パッケージと Apple の Network.framework が
  # 衝突しクリーンビルドが失敗するため）。再有効化する場合は下のブロックのコメントを外す。
  # RevenueCat:
  #   url: https://github.com/RevenueCat/purchases-ios
  #   from: 5.14.0
  # GoogleMobileAds: Stage 1（バナーのみ）導入済み。衝突調査は T0 Spike（commit 7db0ed2）で完了。
  # docs/plans/admob-integration/plan.md §5 Wave2 T9
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Google OAuth（iOS 種別のクライアント ID）。空なら Google ログインは無効（ボタンは出るが理由を表示する）。
    # 例) GOOGLE_IOS_CLIENT_ID: 1234567890-abcdef.apps.googleusercontent.com
    #     GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.1234567890-abcdef
    # **この値が BE の GOOGLE_CLIENT_IDS に含まれていること**が動作条件（plan.md §7.2.1）
    GOOGLE_IOS_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: ""
    REVENUECAT_API_KEY: ""
    # AdMob アプリ ID（GADApplicationIdentifier）。
    # **空文字・キー欠落は不可**: GoogleMobileAds SDK はリンクされているだけで起動時に
    # GADApplicationVerifyPublisherInitializedCorrectly を実行し、値が不正なら
    # NSException（SIGABRT）でアプリを落とす。`GADMobileAds.start` を呼ぶかどうかとは無関係。
    # 実 ID を取得するまでは Google 公式のサンプルアプリ ID を置く（plan.md U1 で実 ID に差し替える）。
    # 広告を実際に配信するかどうかは下の ADMOB_UNIT_* が空かどうかで決まる（F1-6 / AC-AD-36）。
    ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
    # 広告ユニット ID（Stage 1 のバナー 3 面のみ。空なら該当面の枠は高さ 0）。
    # Stage 2（ホーム/申込一覧のネイティブ・リワード）のユニットは Stage 2 で追加する。
    ADMOB_UNIT_IDENTITIES_BANNER: ""
    ADMOB_UNIT_TOURTABLE_BANNER: ""
    ADMOB_UNIT_IDENTITYDETAIL_BANNER: ""
  configs:
    Debug:
      API_BASE_URL: http://localhost:8080
    Release:
      # TODO: Cloud Run の URL を設定する（.xcconfig による環境分離は docs/09 1-16）
      API_BASE_URL: https://api.meigicho.example

targets:
  Meigicho:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meigicho.app
        INFOPLIST_KEY_CFBundleDisplayName: 参戦名義帳
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Features
        product: Features
      - package: DesignSystem
        product: DesignSystem
      - package: Domain
        product: Domain
      - package: DataStore
        product: DataStore
      - package: Network
        product: Network
      # RevenueCat: 上の packages ブロックと合わせて一時無効化中
      # - package: RevenueCat
      #   product: RevenueCat
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 参戦名義帳
        UILaunchScreen: {}
        API_BASE_URL: $(API_BASE_URL)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        ADMOB_APP_ID: $(ADMOB_APP_ID)
        # AdMob SDK が要求する Info.plist キー。値が空でも SDK 自体は初期化しない
        # （AdRendererFactory が ADMOB_APP_ID 空文字を検出して DisabledAdRenderer を返すため）。
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ADMOB_UNIT_IDENTITIES_BANNER: $(ADMOB_UNIT_IDENTITIES_BANNER)
        ADMOB_UNIT_TOURTABLE_BANNER: $(ADMOB_UNIT_TOURTABLE_BANNER)
        ADMOB_UNIT_IDENTITYDETAIL_BANNER: $(ADMOB_UNIT_IDENTITYDETAIL_BANNER)
        # ASWebAuthenticationSession のコールバック（reversed client ID スキーム）
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.googleusercontent.apps
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          # 共有リンクの受け口 `meigicho://share/<token>`（T4b / plan.md §7.7）。
          # Universal Links は roadmap 1-7 と同時の別計画
          - CFBundleTypeRole: Viewer
            CFBundleURLName: jp.meigicho.app.share
            CFBundleURLSchemes:
              - meigicho
        NSAppTransportSecurity:
          # ローカル API（http://localhost:8080）に到達するために必要。
          # 任意の平文通信を許す NSAllowsArbitraryLoads は使わない
          NSAllowsLocalNetworking: true
        NSUserNotificationsUsageDescription: FC更新期限と当落発表日をお知らせするために通知を使います。

schemes:
  Meigicho:
    build:
      targets:
        Meigicho: all
    run:
      config: Debug
