name: Terraform Plan

# infra/terraform/ を変更する PR で plan だけを実行し、ログに出す（レビュー用）。
# apply は行わない — それは terraform-apply.yml（workflow_dispatch = 手動）の担当。
#
# `terraform plan` は PR ブランチのコード（provider 設定 / data source）を CI 上で評価する。
# したがってここで使う GCP 認証情報は **読み取り専用の terraform_planner SA** に限定する
# （書き込み権限を持つ terraform_deployer はこのワークフローからは借用できない。
#  infra/terraform/terraform_deployer.tf のコメント参照）。
#
# 前提: infra/terraform/README.md の 0 節（初回セットアップ・state バケット作成）が完了していること。
# 必要な GitHub Variables: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_TERRAFORM_PLANNER_SA,
#                          CORS_ORIGINS, GOOGLE_CLIENT_IDS, SHARE_BASE_URL, RESEND_FROM_EMAIL,
#                          APPLE_CLIENT_ID
# 必要な GitHub Secrets: TF_STATE_BUCKET

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLANNER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # planner SA は state バケットに書けない（objectViewer のみ）ため lock を取らない。
      - name: terraform init
        run: terraform init -lock=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color -input=false -lock=false
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS }}
          TF_VAR_google_client_ids: ${{ vars.GOOGLE_CLIENT_IDS }}
          TF_VAR_share_base_url: ${{ vars.SHARE_BASE_URL }}
          TF_VAR_resend_from_email: ${{ vars.RESEND_FROM_EMAIL }}
          TF_VAR_apple_client_id: ${{ vars.APPLE_CLIENT_ID }}
